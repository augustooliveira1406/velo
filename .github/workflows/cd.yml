
name: Continuous Deployment

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '22'
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_SCOPE: augusto-oliveira-s-projects
  TESTDINO: ${{ secrets.TESTDINO_TOKEN}}

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Realiza o checkout do código do repositório
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      # 2. Configura o ambiente Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto
      - name: Install dependencies
        run: yarn install

      # 5. Executa os testes unitários com Vitest
      - name: Run unit tests
        run: yarn test
  
  build-and-deploy-preview:
    name: Build & Deploy Vercel Preview
    needs: [unit-tests]
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      # 1. Faz o checkout do código do repositório
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      # 2. Configura o ambiente Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto
      - name: Install dependencies
        run: yarn install
      
      # 5. Obter as conficurações do Vercel
      - name: Pull Vercel Config
        run: |
          yarn vercel pull --yes \
          --environment=preview \
          --token=$VERCEL_TOKEN \
          --scope=$VERCEL_SCOPE

      # 5.1 Debug
      - name: Debug Vercel Environment Files
        run: |
          echo "=== .vercel directory ==="
          ls -la .vercel || true

          echo ""
          echo "=== Environment files ==="
          find .vercel -type f | sort
      
      - name: Check Test Variable
        run: |
          grep "TESTE_PIPELINE" .vercel/.env.preview.local || true

      - name: Check raw env file
        run: |
          echo "=== ENV FILE ==="
          sed -n '/VITE_SUPABASE/p' .vercel/.env.preview.local

      - name: Show Preview Environment
        run: |
          cat .vercel/project.json

      - name: Validate Preview Variables
        run: |
          echo "URL length:"
          echo -n "$VITE_SUPABASE_URL" | wc -c
        
          echo "PROJECT_ID length:"
          echo -n "$VITE_SUPABASE_PROJECT_ID" | wc -c
        
          echo "KEY length:"
          echo -n "$VITE_SUPABASE_PUBLISHABLE_KEY" | wc -c
    
      - name: Show VITE Variables Names
        run: |
          echo "=== VITE VARIABLES ==="
          cut -d '=' -f1 .vercel/.env.preview.local | sort      
        
      # 6. Build para o Vercel
      - name: Build Vercel Preview
        run: yarn vercel build --token=$VERCEL_TOKEN

      # 7. Deploy Preview no Vercel
      - name: Deploy Preview
        id: deploy
        run: |
          URL=$(yarn --silent vercel deploy --prebuilt \
          --target=preview \
          --token=$VERCEL_TOKEN \
          --scope=$VERCEL_SCOPE | tail -1)
          echo "deployment-url=$URL" >> $GITHUB_OUTPUT
      
  e2e-tests:
    name: Run E2E Tests
    needs: [build-and-deploy-preview]
    runs-on: ubuntu-latest

    steps:
      # 1. Faz o checkout do código do repositório
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      # 2. Configura o ambiente Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto
      - name: Install dependencies
        run: yarn install

      # 5. Instalação do Chromium (sem --with-deps: apt-get trava no ubuntu-latest)
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install Playwright Browser
        timeout-minutes: 10
        run: yarn exec playwright install chromium

      # 6. Execução dos Testes de Regressão
      - name: Run E2E Regression Tests
        run: yarn playwright test
        env:
          BASE_URL: ${{ needs.build-and-deploy-preview.outputs.deployment-url }}

      # 7. Relatório de Testes Automatizados
      - name: Upload Playwright Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: playwright-report
      
      # 8. Publicar report TestDino
      - name: Publish TestDino Report
        if: ${{ !cancelled() }}
        run: npx tdpw upload ./playwright-report --token=${{ secrets.TESTDINO_TOKEN}}

  deploy-production:
      name: Build & Deploy Production
      needs: [e2e-tests]
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repository
          uses: actions/checkout@v6.0.2

        - name: Setup Node.js
          uses: actions/setup-node@v6.4.0
          with:
            node-version: ${{ env.NODE_VERSION }}

        - name: Enable Corepack
          run: corepack enable

        - name: Install dependencies
          run: yarn install

        - name: Pull Production Environment Variables
          run: |
            yarn vercel pull --yes \
              --environment=production \
              --token=$VERCEL_TOKEN \
              --scope=$VERCEL_SCOPE

        - name: Build Production
          run: |
            yarn vercel build \
              --prod \
              --token=$VERCEL_TOKEN

        - name: Deploy Production
          run: |
            yarn vercel deploy \
              --prebuilt \
              --prod \
              --token=$VERCEL_TOKEN \
              --scope=$VERCEL_SCOPE

